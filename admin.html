<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Maa Welfare - Admin</title>
<style>
:root{--bg:#f4f8f7;--surface:#fff;--ink:#0b1f2a;--muted:#52666f;--line:#dfe9e6;--brand:#0f766e;--brand-ink:#fff;--good:#1b7a4b;--warn:#9a6200;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08130f;--surface:#0f1d19;--ink:#e9f4f1;--muted:#90a9a3;--line:#1d322c;--brand:#2dd4bf;--brand-ink:#03211c;--good:#58c78d;--warn:#f0b64a;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:1.5rem;margin:8px 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer}
button.p{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.d{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.muted{color:var(--muted);font-size:.9rem}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;border:1px solid currentColor}
.review{color:var(--warn)}.confirmed{color:var(--good)}.rejected{color:var(--bad)}
.err{color:var(--bad);font-weight:600}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:10px 0}dt{color:var(--muted)}dd{margin:0;word-break:break-word}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Maa Welfare - donation review</h1>
  <div id="login" class="card" hidden>
    <label for="u">Username</label><input id="u" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="lerr" role="alert"></p>
    <button class="p" id="lbtn">Sign in</button>
  </div>
  <div id="app" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="row tabs" id="tabs"></div>
      <button id="out">Sign out</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  let all=[],tab="review";
  const api=async(path,opt)=>{const r=await fetch(path,Object.assign({credentials:"same-origin",headers:{"content-type":"application/json"}},opt));const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||"Error"),{status:r.status});return j;};
  const el=(t,a,...k)=>{const e=document.createElement(t);for(const x in a||{})x==="class"?e.className=a[x]:e.setAttribute(x,a[x]);k.flat().forEach(c=>e.append(c));return e;};
  const money=(c,a)=>c+" "+Number(a).toLocaleString("en-US");
  function show(l){$("login").hidden=!l;$("app").hidden=l;}
  async function load(){try{all=(await api("/api/admin/donations")).donations;show(false);draw();}catch(e){show(true);}}
  function draw(){
    const t=$("tabs");t.replaceChildren();
    [["review","Under review"],["confirmed","Confirmed"],["rejected","Rejected"]].forEach(([k,n])=>{
      const c=all.filter(d=>d.status===k).length;
      const b=el("button",{type:"button","aria-pressed":String(tab===k)},n+" ("+c+")");b.onclick=()=>{tab=k;draw();};t.append(b);});
    const L=$("list");L.replaceChildren();
    const rows=all.filter(d=>d.status===tab);
    if(!rows.length)L.append(el("p",{class:"muted"},"Nothing here."));
    rows.forEach(d=>L.append(card(d)));
  }
  function card(d){
    const c=el("div",{class:"card"});
    c.append(el("div",{class:"row",style:"justify-content:space-between"},el("b",{},d.ref+" - "+money(d.currency,d.amount)),el("span",{class:"tag "+d.status},d.status==="review"?"Under review":d.status)));
    const dl=el("dl");
    [["Donor",d.name],["Contact",d.contact],["Method",d.method],["Transaction no.",d.txn||"-"],["Gift date",d.date||"-"],["Fund",d.fund],["Note",d.note||"-"],["Receipt requested",d.wantReceipt?"Yes":"No"],["Submitted",new Date(d.created).toLocaleString()]].forEach(([k,v])=>dl.append(el("dt",{},k),el("dd",{},v)));
    if(d.status==="confirmed")dl.append(el("dt",{},"Received"),el("dd",{},money(d.currency,d.receivedAmount)));
    if(d.reviewNote)dl.append(el("dt",{},"Review note"),el("dd",{},d.reviewNote));
    c.append(dl);
    if(d.files&&d.files.length){const r=el("div",{class:"row"});d.files.forEach((f,i)=>r.append(el("a",{href:"/api/admin/file/"+d.ref+"/"+i,target:"_blank",rel:"noopener"},"View "+f.label)));c.append(r);}
    else c.append(el("p",{class:"muted"},"No receipt attached."));
    if(d.status==="review"){
      const a=el("input",{type:"text",inputmode:"decimal",value:String(d.amount),"aria-label":"Amount actually received"});
      const n=el("input",{type:"text",placeholder:"Optional note","aria-label":"Review note"});
      const msg=el("p",{class:"err",role:"alert"});
      const go=async action=>{if(action==="reject"&&!confirm("Reject this donation?"))return;try{await api("/api/admin/donations/"+d.ref,{method:"POST",body:JSON.stringify({action,receivedAmount:a.value,note:n.value})});await load();}catch(e){msg.textContent=e.message;if(e.status===401)show(true);}};
      const ok=el("button",{class:"p",type:"button"},"Yes, amount received - confirm");ok.onclick=()=>go("confirm");
      const no=el("button",{class:"d",type:"button"},"Reject");no.onclick=()=>go("reject");
      c.append(el("label",{},"Amount actually received ("+d.currency+")"),a,el("label",{},"Note"),n,el("div",{class:"row",style:"margin-top:12px"},ok,no),msg);
    }
    return c;
  }
  $("lbtn").onclick=async()=>{$("lerr").textContent="";try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({user:$("u").value,pass:$("pw").value})});$("pw").value="";await load();}catch(e){$("lerr").textContent=e.message;}};
  $("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("lbtn").click();});
  $("out").onclick=async()=>{try{await api("/api/admin/logout",{method:"POST"});}catch(e){}all=[];show(true);};
  load();
})();
</script>
</body>
</html>
