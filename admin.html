<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Maa Welfare - Admin</title>
<style>
:root{--bg:#f4f8f7;--surface:#fff;--ink:#0b1f2a;--muted:#52666f;--line:#dfe9e6;--brand:#0f766e;--brand-ink:#fff;--good:#1b7a4b;--warn:#9a6200;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08130f;--surface:#0f1d19;--ink:#e9f4f1;--muted:#90a9a3;--line:#1d322c;--brand:#2dd4bf;--brand-ink:#03211c;--good:#58c78d;--warn:#f0b64a;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:1.5rem;margin:8px 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer}
button.p{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.d{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.muted{color:var(--muted);font-size:.9rem}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;border:1px solid currentColor}
.review{color:var(--warn)}.confirmed{color:var(--good)}.rejected{color:var(--bad)}
.err{color:var(--bad);font-weight:600}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:10px 0}dt{color:var(--muted)}dd{margin:0;word-break:break-word}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Maa Welfare - donation review</h1>
  <div id="login" class="card" hidden>
    <label for="u">Username</label><input id="u" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="lerr" role="alert"></p>
    <button class="p" id="lbtn">Sign in</button>
  </div>
  <div id="app" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="row tabs" id="tabs"></div>
      <button id="out">Sign out</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  let all=[],exps=[],tab="review",role="admin";
  const api=async(path,opt)=>{const r=await fetch(path,Object.assign({credentials:"same-origin",headers:{"content-type":"application/json"}},opt));const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||"Error"),{status:r.status});return j;};
  const el=(t,a,...k)=>{const e=document.createElement(t);for(const x in a||{})x==="class"?e.className=a[x]:e.setAttribute(x,a[x]);k.flat().forEach(c=>e.append(c));return e;};
  const money=(c,a)=>c+" "+Number(a).toLocaleString("en-US");
  function show(l){$("login").hidden=!l;$("app").hidden=l;}
  async function load(){try{role=(await api("/api/admin/me")).role;all=(await api("/api/admin/donations")).donations;exps=(await api("/api/admin/expenses")).expenses;show(false);draw();}catch(e){show(true);}}
  function draw(){
    const t=$("tabs");t.replaceChildren();
    [["review","Under review"],["confirmed","Confirmed"],["rejected","Rejected"],["fin","Financials"]].forEach(([k,n])=>{
      const c=k==="fin"?"":" ("+all.filter(d=>d.status===k).length+")";
      const b=el("button",{type:"button","aria-pressed":String(tab===k)},n+c);b.onclick=()=>{tab=k;draw();};t.append(b);});
    const L=$("list");L.replaceChildren();
    if(tab==="fin")return fin(L);
    const rows=all.filter(d=>d.status===tab);
    if(!rows.length)L.append(el("p",{class:"muted"},"Nothing here."));
    rows.forEach(d=>L.append(card(d)));
  }

  const amt=d=>d.receivedAmount||d.amount, mon=d=>(d.date||d.created||"").slice(0,7)||"unknown", fmt=n=>Number(n).toLocaleString("en-US",{maximumFractionDigits:2});
  const tbl=(h,rows)=>{const t=el("table",{style:"width:100%;border-collapse:collapse;font-size:.92rem"});t.append(el("tr",{},h.map(x=>el("th",{style:"text-align:left;padding:6px;border-bottom:2px solid var(--line)"},x))));rows.forEach(r=>t.append(el("tr",{},r.map(x=>el("td",{style:"padding:6px;border-bottom:1px solid var(--line)"},String(x))))));return el("div",{style:"overflow-x:auto"},t);};
  function fin(L){
    const ok=all.filter(d=>d.status==="confirmed"),cs=[...new Set([...ok.map(d=>d.currency),...exps.map(e=>e.currency)])].sort();
    const sum=(arr,c,f)=>arr.filter(x=>x.currency===c).reduce((t,x)=>t+f(x),0);
    const c1=el("div",{class:"card"},el("h3",{},"Income and expenditure"),el("p",{class:"muted"},"Cash basis: only confirmed donations count as income."));
    c1.append(cs.length?tbl(["Currency","Income","Expenses","Balance"],cs.map(c=>{const i=sum(ok,c,amt),x=sum(exps,c,e=>e.amount);return[c,fmt(i),fmt(x),fmt(i-x)];})):el("p",{class:"muted"},"No confirmed donations or expenses yet."));
    L.append(c1);
    const by=(arr,key,f)=>{const m={};arr.forEach(x=>{const k=key(x);m[k]=(m[k]||0)+f(x);});return m;};
    const fd=by(ok,d=>d.fund+"|"+d.currency,amt),c2=el("div",{class:"card"},el("h3",{},"Income by fund"));
    c2.append(Object.keys(fd).length?tbl(["Fund","Currency","Amount"],Object.keys(fd).sort().map(k=>{const[a,b]=k.split("|");return[a,b,fmt(fd[k])];})):el("p",{class:"muted"},"Nothing yet."));L.append(c2);
    const mi=by(ok,d=>mon(d)+"|"+d.currency,amt),me=by(exps,e=>mon(e)+"|"+e.currency,e=>e.amount),mk=[...new Set([...Object.keys(mi),...Object.keys(me)])].sort().reverse(),c3=el("div",{class:"card"},el("h3",{},"By month"));
    c3.append(mk.length?tbl(["Month","Currency","Income","Expenses","Balance"],mk.map(k=>{const[a,b]=k.split("|"),i=mi[k]||0,x=me[k]||0;return[a,b,fmt(i),fmt(x),fmt(i-x)];})):el("p",{class:"muted"},"Nothing yet."));L.append(c3);
    // add expense
    const f=el("div",{class:"card"},el("h3",{},"Record an expense"));
    const date=el("input",{type:"date",value:new Date().toISOString().slice(0,10),"aria-label":"Date"}),cur=el("select",{"aria-label":"Currency"},["PKR","OMR","USD","AED","SAR","GBP","EUR","QAR","KWD","BHD","CAD","AUD"].map(x=>el("option",{value:x},x))),amount=el("input",{type:"text",inputmode:"decimal","aria-label":"Amount"}),cat=el("select",{"aria-label":"Category"},["School fees","Books and supplies","Medical","Running costs","Other"].map(x=>el("option",{},x))),desc=el("input",{type:"text",placeholder:"What was it for?","aria-label":"Description"}),msg=el("p",{class:"err",role:"alert"});
    const add=el("button",{class:"p",type:"button"},"Save expense");add.onclick=async()=>{msg.textContent="";try{await api("/api/admin/expenses",{method:"POST",body:JSON.stringify({date:date.value,currency:cur.value,amount:amount.value,category:cat.value,description:desc.value})});await load();}catch(e){msg.textContent=e.message;}};
    f.append(el("label",{},"Date"),date,el("label",{},"Currency"),cur,el("label",{},"Amount"),amount,el("label",{},"Category"),cat,el("label",{},"Description"),desc,el("div",{class:"row",style:"margin-top:12px"},add),msg);if(role==="admin")L.append(f);
    const c4=el("div",{class:"card"},el("h3",{},"Expenses recorded"));
    exps.forEach(e=>{const del=el("button",{class:"d",type:"button"},"Delete");del.onclick=async()=>{if(!confirm("Delete this expense?"))return;try{await api("/api/admin/expenses/"+e.id,{method:"DELETE"});await load();}catch(x){alert(x.message);}};c4.append(el("div",{class:"row",style:"justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"},el("span",{},e.date+" - "+e.category+" - "+e.description+" - "+e.currency+" "+fmt(e.amount)),role==="admin"?del:""));});
    if(!exps.length)c4.append(el("p",{class:"muted"},"None yet."));L.append(c4);
    const dl=el("button",{class:"p",type:"button"},"Download everything as CSV (Excel)");dl.onclick=csv;L.append(el("div",{class:"row"},dl));
  }
  function csv(){
    const q=v=>{v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};
    const rows=[["Type","Date","Reference","Name","Contact","Currency","Amount","Status","Fund or category","Details"]];
    all.forEach(d=>rows.push(["Donation",d.date||d.created.slice(0,10),d.ref,d.name,d.contact,d.currency,d.status==="confirmed"?d.receivedAmount:d.amount,d.status,d.fund,d.txn||""]));
    exps.forEach(e=>rows.push(["Expense",e.date,e.id,"","",e.currency,e.amount,"recorded",e.category,e.description]));
    const b=new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"}),u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download="maa-welfare-financials-"+new Date().toISOString().slice(0,10)+".csv";document.body.append(l);l.click();l.remove();URL.revokeObjectURL(u);
  }
  function card(d){
    const c=el("div",{class:"card"});
    c.append(el("div",{class:"row",style:"justify-content:space-between"},el("b",{},d.ref+" - "+money(d.currency,d.amount)),el("span",{class:"tag "+d.status},d.status==="review"?"Under review":d.status)));
    const dl=el("dl");
    [["Donor",d.name],["Contact",d.contact],["Method",d.method],["Transaction no.",d.txn||"-"],["Gift date",d.date||"-"],["Fund",d.fund],["Note",d.note||"-"],["Receipt requested",d.wantReceipt?"Yes":"No"],["Submitted",new Date(d.created).toLocaleString()]].forEach(([k,v])=>dl.append(el("dt",{},k),el("dd",{},v)));
    if(d.status==="confirmed")dl.append(el("dt",{},"Received"),el("dd",{},money(d.currency,d.receivedAmount)));
    if(d.reviewNote)dl.append(el("dt",{},"Review note"),el("dd",{},d.reviewNote));
    c.append(dl);
    if(d.files&&d.files.length){const r=el("div",{class:"row"});d.files.forEach((f,i)=>r.append(el("a",{href:"/api/admin/file/"+d.ref+"/"+i,target:"_blank",rel:"noopener"},"View "+f.label)));c.append(r);}
    else c.append(el("p",{class:"muted"},"No receipt attached."));
    if(d.status==="review"&&role!=="admin")c.append(el("p",{class:"muted"},"View-only account: you cannot confirm or reject."));
    if(d.status==="review"&&role==="admin"){
      const a=el("input",{type:"text",inputmode:"decimal",value:String(d.amount),"aria-label":"Amount actually received"});
      const n=el("input",{type:"text",placeholder:"Optional note","aria-label":"Review note"});
      const msg=el("p",{class:"err",role:"alert"});
      const go=async action=>{if(action==="reject"&&!confirm("Reject this donation?"))return;try{await api("/api/admin/donations/"+d.ref,{method:"POST",body:JSON.stringify({action,receivedAmount:a.value,note:n.value})});await load();}catch(e){msg.textContent=e.message;if(e.status===401)show(true);}};
      const ok=el("button",{class:"p",type:"button"},"Yes, amount received - confirm");ok.onclick=()=>go("confirm");
      const no=el("button",{class:"d",type:"button"},"Reject");no.onclick=()=>go("reject");
      c.append(el("label",{},"Amount actually received ("+d.currency+")"),a,el("label",{},"Note"),n,el("div",{class:"row",style:"margin-top:12px"},ok,no),msg);
    }
    return c;
  }
  $("lbtn").onclick=async()=>{$("lerr").textContent="";try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({user:$("u").value,pass:$("pw").value})});$("pw").value="";await load();}catch(e){$("lerr").textContent=e.message;}};
  $("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("lbtn").click();});
  $("out").onclick=async()=>{try{await api("/api/admin/logout",{method:"POST"});}catch(e){}all=[];show(true);};
  load();
})();
</script>
</body>
</html>
